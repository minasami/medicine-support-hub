name: Catalog price alerts

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: catalog-price-alerts
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
      PRICE_ALERT_WEBHOOK: ${{ secrets.PRICE_ALERT_WEBHOOK }}
      PRICE_ALERT_THRESHOLD_PCT: "5"
      PRICE_ALERTS_WRITE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compare catalog snapshot
        working-directory: apps/mcp-server
        run: node src/price-alerts.mjs --write > /tmp/price-alerts.json
      - name: Show summary
        run: python3 - <<'PY'
import json
from pathlib import Path
data = json.loads(Path("/tmp/price-alerts.json").read_text())
print(f"alerts={data.get('alert_count')} first={data.get('first_snapshot')} watched={data.get('watch_count')}")
for row in data.get("alerts") or []:
    print(f"{row.get('query')} {row.get('from_egp')} -> {row.get('to_egp')} ({row.get('change_pct')}%)")
PY
      - name: Open or update GitHub issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('/tmp/price-alerts.json', 'utf8'));
            if (!data.alert_count) {
              core.info('No threshold alerts');
              return;
            }
            const title = 'Catalog price alerts';
            const lines = [
              `Observed: ${data.observed_at}`,
              `Threshold: ${data.threshold_pct}%`,
              '',
              '| Brand | From EGP | To EGP | Change |',
              '|---|---:|---:|---:|',
              ...data.alerts.map((row) => `| ${row.query} | ${row.from_egp} | ${row.to_egp} | ${row.change_pct}% |`),
              '',
              data.disclaimer_en,
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ];
            const body = lines.join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'price-alert',
              per_page: 20
            });
            const issue = existing.data.find((item) => item.title === title);
            if (issue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['price-alert']
              });
            }
      - name: Commit snapshot if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mcp-server/src/data/price-snapshot.json
          if git diff --staged --quiet; then
            echo "No snapshot change"
            exit 0
          fi
          git commit -m "Update catalog price snapshot"
          git push

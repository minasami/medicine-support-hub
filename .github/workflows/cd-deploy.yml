name: CD Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_functions:
        description: Deploy Appwrite functions (CLI)
        type: boolean
        default: true
      redeploy_site:
        description: Trigger Appwrite Site VCS rebuild
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cd-deploy-main
  cancel-in-progress: false

env:
  APPWRITE_ENDPOINT: ${{ vars.APPWRITE_ENDPOINT || 'https://fra.cloud.appwrite.io/v1' }}
  APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
  APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
  APPWRITE_SITE_ID: ${{ secrets.APPWRITE_SITE_ID }}
  APPWRITE_SITE_BRANCH: ${{ vars.APPWRITE_SITE_BRANCH || 'main' }}

jobs:
  gate:
    name: Build gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build

  deploy-site:
    name: Redeploy Appwrite Site (VCS)
    needs: gate
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.redeploy_site == true)
      || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Trigger Site VCS deployment
        run: |
          if [ -z "$APPWRITE_API_KEY" ] || [ -z "$APPWRITE_PROJECT_ID" ]; then
            echo "Skipping site deploy — APPWRITE_API_KEY / APPWRITE_PROJECT_ID not set."
            exit 0
          fi
          if [ -z "$APPWRITE_SITE_ID" ]; then
            echo "APPWRITE_SITE_ID not set — listing sites:"
            node scripts/appwrite-deploy.mjs --list-sites || true
            echo "Set GitHub secret APPWRITE_SITE_ID, then re-run CD."
            echo "Git-connected Sites still auto-deploy on push to main."
            exit 0
          fi
          node scripts/appwrite-deploy.mjs --site

  deploy-functions:
    name: Deploy Appwrite functions
    needs: gate
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.deploy_functions == true)
      || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Appwrite CLI
        run: npm install -g appwrite-cli@7 || npm install -g appwrite-cli@6
      - name: Deploy functions from appwrite.json
        run: |
          if [ -z "$APPWRITE_API_KEY" ] || [ -z "$APPWRITE_PROJECT_ID" ]; then
            echo "Skipping function deploy — secrets not set."
            exit 0
          fi

          export APPWRITE_KEY="$APPWRITE_API_KEY"

          appwrite client \
            --endpoint "$APPWRITE_ENDPOINT" \
            --project-id "$APPWRITE_PROJECT_ID" \
            --key "$APPWRITE_API_KEY" || true

          if appwrite push functions --all --force 2>/dev/null; then
            echo "push functions --all succeeded"
            exit 0
          fi

          echo "Deploying each function directory…"
          for dir in functions/*; do
            [ -d "$dir" ] || continue
            id=$(basename "$dir")
            echo "→ $id"
            appwrite push function --function-id "$id" --force 2>/dev/null \
              || appwrite deploy function --function-id "$id" --activate true 2>/dev/null \
              || appwrite functions create-deployment \
                   --function-id "$id" \
                   --code "$dir" \
                   --activate true \
                   --entrypoint "src/main.js" 2>/dev/null \
              || echo "WARN: could not deploy $id (create once in Console)"
          done
